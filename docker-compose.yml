services:
  backend:
    build:
      context: ./bugtracker-backend
      dockerfile: Dockerfile
    container_name: bugtracker-backend
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./bugtracker-frontend
      dockerfile: Dockerfile
    container_name: bugtracker-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8082:8080"   # New host port 8082
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped

volumes:
  jenkins_home: